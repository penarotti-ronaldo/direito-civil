<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulado – Direito Civil (V ou F)</title>
<style>
  :root{
    --bg:#eef1f8;
    --card:#ffffff;
    --texto:#1d2433;
    --muted:#6b7690;
    --accent:#2f5bea;
    --accent-soft:#e6ecff;
    --ok:#0f9d58;
    --ok-soft:#e6f7ee;
    --err:#d93025;
    --err-soft:#fdecea;
    --borda:#dfe4f0;
    --sombra:0 2px 10px rgba(29,36,51,.07);
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    font-family:"Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:var(--bg);
    color:var(--texto);
    line-height:1.55;
  }

  /* ---------- Topo ---------- */
  header{
    background:linear-gradient(135deg,#2f5bea,#5b3fe0);
    color:#fff;
    padding:28px 20px 22px;
  }
  .header-inner{
    max-width:900px;
    margin:0 auto;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.6rem;
    letter-spacing:.2px;
  }
  header p{
    margin:0;
    opacity:.9;
    font-size:.95rem;
  }

  /* ---------- Barra de progresso fixa ---------- */
  .barra{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--borda);
    padding:10px 20px;
  }
  .barra-inner{
    max-width:900px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    font-size:.9rem;
  }
  .placar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .chip{
    background:var(--accent-soft);
    color:var(--accent);
    border-radius:999px;
    padding:4px 12px;
    font-weight:600;
    font-size:.82rem;
  }
  .chip.ok{background:var(--ok-soft);color:var(--ok)}
  .chip.err{background:var(--err-soft);color:var(--err)}
  .barra .spacer{flex:1}

  .btn-reset{
    border:1px solid var(--borda);
    background:#fff;
    color:var(--texto);
    padding:6px 14px;
    border-radius:8px;
    cursor:pointer;
    font-size:.85rem;
    font-weight:600;
    transition:.15s;
  }
  .btn-reset:hover{background:#f2f4fb;border-color:#c9d1e6}

  /* ---------- Lista de questões ---------- */
  main{
    max-width:900px;
    margin:0 auto;
    padding:22px 20px 60px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--borda);
    border-left:5px solid var(--borda);
    border-radius:12px;
    padding:18px 20px 16px;
    margin-bottom:16px;
    box-shadow:var(--sombra);
    transition:border-color .2s, transform .15s;
  }
  .card.acertou{border-left-color:var(--ok)}
  .card.errou{border-left-color:var(--err)}

  .cabecalho{
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .num{
    flex:0 0 auto;
    width:30px;
    height:30px;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    font-weight:700;
    font-size:.85rem;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:2px;
  }
  .card.acertou .num{background:var(--ok)}
  .card.errou .num{background:var(--err)}

  .enunciado{
    margin:0;
    font-size:1rem;
  }

  /* ---------- Opções V / F ---------- */
  .opcoes{
    display:flex;
    gap:10px;
    margin:14px 0 0 42px;
    flex-wrap:wrap;
  }
  .opt{
    cursor:pointer;
    user-select:none;
  }
  .opt input{
    position:absolute;
    opacity:0;
    width:0;
    height:0;
  }
  .opt span{
    display:inline-block;
    padding:8px 20px;
    border:2px solid var(--borda);
    border-radius:9px;
    font-weight:700;
    font-size:.9rem;
    background:#fff;
    transition:.15s;
  }
  .opt:hover span{border-color:#b9c5e6;background:#f7f9ff}
  .opt input:checked + span{
    border-color:var(--accent);
    background:var(--accent-soft);
    color:var(--accent);
  }
  .opt input:focus-visible + span{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  .opt.travada{cursor:default}
  .opt.travada:hover span{border-color:var(--borda);background:#fff}
  .opt.correta span{
    border-color:var(--ok) !important;
    background:var(--ok-soft) !important;
    color:var(--ok) !important;
  }
  .opt.errada-marcada span{
    border-color:var(--err) !important;
    background:var(--err-soft) !important;
    color:var(--err) !important;
    text-decoration:line-through;
  }

  /* ---------- Ações / botão ---------- */
  .acoes{
    margin:14px 0 0 42px;
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
  }
  .btn-verificar{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:9px;
    padding:9px 22px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
    transition:.15s;
  }
  .btn-verificar:hover:not(:disabled){background:#2348c4}
  .btn-verificar:disabled{
    background:#c9d1e6;
    cursor:not-allowed;
  }

  .aviso{
    color:var(--err);
    font-size:.83rem;
    font-weight:600;
  }

  /* ---------- Feedback ---------- */
  .feedback{
    margin:14px 0 0 42px;
    border-radius:10px;
    padding:0 14px;
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition:max-height .3s ease, opacity .3s ease, padding .3s ease;
    font-size:.9rem;
  }
  .feedback.visivel{
    max-height:400px;
    opacity:1;
    padding:12px 14px;
  }
  .feedback.ok{
    background:var(--ok-soft);
    border-left:4px solid var(--ok);
  }
  .feedback.err{
    background:var(--err-soft);
    border-left:4px solid var(--err);
  }
  .feedback .titulo{
    font-weight:700;
    display:block;
    margin-bottom:5px;
  }
  .feedback.ok .titulo{color:var(--ok)}
  .feedback.err .titulo{color:var(--err)}
  .feedback p{margin:0;color:#333c50}

  /* ---------- Animação de erro ---------- */
  @keyframes tremer{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-6px)}
    40%{transform:translateX(6px)}
    60%{transform:translateX(-4px)}
    80%{transform:translateX(4px)}
  }
  .tremer{animation:tremer .35s}

  @media (max-width:560px){
    .opcoes, .acoes, .feedback{margin-left:0}
    .opt span{padding:8px 14px;font-size:.85rem}
    header h1{font-size:1.3rem}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>Simulado de Direito Civil</h1>
    <p>40 afirmações • Marque <strong>V</strong> (Verdadeiro) ou <strong>F</strong> (Falso) e clique em <strong>Verificar</strong> em cada questão para ver a correção comentada.</p>
  </div>
</header>

<div class="barra">
  <div class="barra-inner">
    <div class="placar">
      <span class="chip" id="chip-respondidas">Respondidas: 0/40</span>
      <span class="chip ok" id="chip-acertos">Acertos: 0</span>
      <span class="chip err" id="chip-erros">Erros: 0</span>
    </div>
    <div class="spacer"></div>
    <button class="btn-reset" id="btn-reset">Reiniciar simulado</button>
  </div>
</div>

<main id="quiz"></main>

<script>
/* =========================================================
   BANCO DE QUESTÕES
   resp: "V" ou "F"  |  comentario: gabarito comentado
   ========================================================= */
const QUESTOES = [
  {
    n: 1,

  },
  {

  },

    comentario: "A posse injusta é a violenta, clandestina ou precária. A posse justa é a que não possui esses vícios."
  },
  {

    texto: "É de má-fé a posse quando o possuidor ignora o vício ou o obstáculo que impede a aquisição da coisa.",

    comentario: "A boa-fé caracteriza-se pela ignorância do possuidor em relação aos vícios ou obstáculos que impedem a aquisição do bem."
  },
  {

    texto: "O possuidor tem o direito de ser mantido na posse em caso de turbação e reintegrado no caso de esbulho.",

  {

  {

  {

  {

  {

    texto: "A emancipação de um menor de 16 anos completos pode ser concedida pelos pais ou por sentença judicial.",

    comentario: "A concessão pelos pais ou a sentença judicial exige que o menor tenha 16 anos completos."

  {

  },
  {
    n: 28,

    comentario: "O cônjuge/companheiro e parentes até o 4º grau têm legitimidade para reclamar e exigir que cesse lesão aos direitos do falecido."
  },
  {
    n: 29,
    texto: "As pessoas jurídicas de direito público interno respondem objetivamente pelos danos que seus agentes causarem, garantido o direito de regresso contra o causador caso haja dolo ou culpa.",
    resp: "V",
    comentario: "A responsabilidade civil das pessoas jurídicas de direito público é objetiva, com direito de regresso condicionado ao dolo ou culpa do agente."

    resp: "V",

  {

    resp: "F",

  },
  {

    resp: "V",
    comentario: "O possuidor de má-fé responde por todos os frutos (percebidos e os que deixou de perceber por culpa), mantendo apenas o direito ao ressarcimento das benfeitorias necessárias, sem retenção."

/* =========================================================
   ESTADO
   ========================================================= */
const TOTAL = QUESTOES.length;
const respondidas = new Set();
let acertos = 0;
let erros = 0;

/* =========================================================
   RENDERIZAÇÃO
   ========================================================= */
const quizEl = document.getElementById('quiz');

function renderizar() {
  quizEl.innerHTML = QUESTOES.map(q => `
    <article class="card" id="card-${q.n}">
      <div class="cabecalho">
        <span class="num">${q.n}</span>
        <p class="enunciado">${q.texto}</p>
      </div>

      <div class="opcoes" id="opcoes-${q.n}">
        <label class="opt" data-valor="V">
          <input type="radio" name="q${q.n}" value="V">
          <span>V – Verdadeiro</span>
        </label>
        <label class="opt" data-valor="F">
          <input type="radio" name="q${q.n}" value="F">
          <span>F – Falso</span>
        </label>
      </div>

      <div class="acoes">
        <button class="btn-verificar" data-n="${q.n}">Verificar</button>
        <span class="aviso" id="aviso-${q.n}" style="display:none">Escolha V ou F antes de verificar.</span>
      </div>

      <div class="feedback" id="fb-${q.n}"></div>
    </article>
  `).join('');
}

/* =========================================================
   VERIFICAÇÃO INDIVIDUAL
   ========================================================= */
function verificar(n) {
  const q = QUESTOES.find(item => item.n === n);
  const card = document.getElementById('card-' + n);
  const opcoesBox = document.getElementById('opcoes-' + n);
  const aviso = document.getElementById('aviso-' + n);
  const fb = document.getElementById('fb-' + n);
  const btn = card.querySelector('.btn-verificar');

  // Se já foi respondida, ignora
  if (respondidas.has(n)) return;

  const marcada = card.querySelector(`input[name="q${n}"]:checked`);

  // Nenhuma alternativa selecionada
  if (!marcada) {
    aviso.style.display = 'inline';
    opcoesBox.classList.remove('tremer');
    void opcoesBox.offsetWidth; // reinicia a animação
    opcoesBox.classList.add('tremer');
    return;
  }

  aviso.style.display = 'none';

  const valorMarcado = marcada.value;
  const acertou = valorMarcado === q.resp;

  // Trava as opções e destaca a correta / a errada marcada
  opcoesBox.querySelectorAll('.opt').forEach(opt => {
    opt.classList.add('travada');
    const input = opt.querySelector('input');
    input.disabled = true;
    const valor = opt.dataset.valor;

    if (valor === q.resp) {
      opt.classList.add('correta');
    } else if (valor === valorMarcado) {
      opt.classList.add('errada-marcada');
    }
  });

  // Monta o feedback
  fb.className = 'feedback visivel ' + (acertou ? 'ok' : 'err');
  fb.innerHTML = `
    <span class="titulo">
      ${acertou ? '✔ Você acertou!' : '✘ Você errou.'}
      Resposta correta: <strong>${q.resp === 'V' ? 'VERDADEIRO' : 'FALSO'}</strong>
    </span>
    <p><strong>Comentário:</strong> ${q.comentario}</p>
  `;

  // Ajusta visual do card e do botão
  card.classList.add(acertou ? 'acertou' : 'errou');
  btn.disabled = true;
  btn.textContent = acertou ? 'Acertou ✔' : 'Errou ✘';

  // Atualiza placar
  respondidas.add(n);
  if (acertou) acertos++; else erros++;
  atualizarPlacar();
}

/* =========================================================
   PLACAR
   ========================================================= */
function atualizarPlacar() {
  document.getElementById('chip-respondidas').textContent =
    `Respondidas: ${respondidas.size}/${TOTAL}`;
  document.getElementById('chip-acertos').textContent = `Acertos: ${acertos}`;
  document.getElementById('chip-erros').textContent = `Erros: ${erros}`;
}

/* =========================================================
   EVENTOS
   ========================================================= */
quizEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.btn-verificar');
  if (btn) {
    verificar(Number(btn.dataset.n));
  }
});

// Permite verificar pressionando Enter no radio
quizEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.type === 'radio') {
    const n = Number(e.target.name.replace('q', ''));
    verificar(n);
  }
});

document.getElementById('btn-reset').addEventListener('click', () => {
  respondidas.clear();
  acertos = 0;
  erros = 0;
  atualizarPlacar();
  renderizar();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */
renderizar();
atualizarPlacar();
</script>

</body>
